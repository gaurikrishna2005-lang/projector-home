<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projector wallpaper</title>
<style>
  body { margin: 0; padding: 40px 22px; background: #0e0e10; color: #f2f2f2;
         font-family: -apple-system, system-ui, Roboto, sans-serif; text-align: center; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 10px; }
  p { color: #9a9aa0; line-height: 1.6; margin: 0; font-size: 16px; }
  label { display: block; margin: 32px auto 20px; max-width: 360px; padding: 18px;
          background: #ffffff; color: #0e0e10; border-radius: 14px; font-size: 18px; font-weight: 500; }
  input { display: none; }
  #status { min-height: 1.6em; }
</style>
</head>
<body>
  <h1>Projector wallpaper</h1>
  <p>Pick one or more photos. The last one you send becomes the background.</p>
  <label>Choose photos<input id="files" type="file" accept="image/*" multiple></label>
  <p id="status"></p>
<script>
  const input = document.getElementById('files');
  const status = document.getElementById('status');
  input.addEventListener('change', async () => {
    const files = Array.from(input.files);
    let sent = 0;
    for (let i = 0; i < files.length; i++) {
      status.textContent = 'Sending ' + (i + 1) + ' of ' + files.length + '…';
      try {
        const res = await fetch('/upload', { method: 'POST', body: files[i] });
        if (res.ok) sent++;
      } catch (e) { }
    }
    if (sent === files.length) {
      status.textContent = 'Done. Look at the wall.';
    } else if (sent > 0) {
      status.textContent = sent + ' of ' + files.length + ' sent. Some weren\'t pictures or were too big.';
    } else {
      status.textContent = 'That didn\'t work. Check the Wallpaper screen is still open on the projector.';
    }
    input.value = '';
  });
</script>
</body>
</html>
